[package]
name = "macos-unifiedlogs"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mandiant/macos-unifiedlogs"
description = "A library to help parse macOS UnifiedLogs"
keywords = ["forensics", "macOS", "unifiedlog"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nom = "8"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
lz4_flex = "0.12"
byteorder = "1.5"
plist = "1.9"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sunlight = "0.1"

[dev-dependencies]
simplelog = "0.12"
criterion = "0.7"
anyhow = "1"
test-case = "3.3"

[[bench]]
name = "high_sierra_benchmark"
harness = false

[[bench]]
name = "big_sur_benchmark"
harness = false

[[bench]]
name = "monterey_benchmark"
harness = false
